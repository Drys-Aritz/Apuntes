services:
  db_mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: tienda_db
      MYSQL_USER: tienda_user
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password
    volumes:
      - datos_mysql:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$$(cat /run/secrets/db_root_password)" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - tienda

  php_app:
    build:
      context: ./php
    environment:
      DB_HOST: db_mysql
      DB_NAME: tienda_db
      DB_USER: tienda_user
    secrets:
      - db_password
    depends_on:
      db_mysql:
        condition: service_healthy
    networks:
      - tienda

  web_nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./php/src:/var/www/html:ro
    depends_on:
      - php_app
    networks:
      - tienda

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: db_mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      db_mysql:
        condition: service_healthy
    networks:
      - tienda

volumes:
  datos_mysql:

networks:
  tienda:
    driver: bridge

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt
