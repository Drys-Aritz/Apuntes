<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 4 - CSS Flotar y Posicionar</title>
  <link rel="stylesheet" href="estilos4.css">
</head>
<body>


  <!-- Contenedor general que envuelve todo el layout -->
  <div class="container">
   
    <!-- ENCABEZADO -->
    <header class="header">
      <div class="logo">LOGO</div>
      <div class="navigation">NAVIGATION</div>
    </header>


    <!-- ÁREA PRINCIPAL AZUL -->
    <main class="main-content">
      <!-- Barra lateral izquierda -->
      <aside class="sidebar">SIDEBAR</aside>
     
      <!-- Bloque contenedor de los subcontenidos de la derecha -->
      <div class="right-content">
        <div class="sub-content">SUB CONTENT</div>
        <div class="sub-content-2">SUB CONTENT 2</div>
      </div>
    </main>


    <!-- PIE DE PÁGINA -->
    <footer class="footer">FOOTER</footer>


  </div>


</body>
</html>
